name: container-build

on:
  workflow_call:
    inputs:
      image:
        description: Fully qualified image name
        required: true
        type: string
      dockerfile:
        description: Path to the Containerfile
        required: true
        type: string
      context:
        description: Build context directory
        required: false
        type: string
        default: .
      platforms:
        description: Target platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Whether to push the image
        required: false
        type: boolean
        default: false
      tag:
        description: Image tag (defaults to the short commit SHA)
        required: false
        type: string
        default: ""
      sign:
        description: Whether to sign the pushed image with cosign
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          config: .hadolint.yaml

  build:
    runs-on: ubuntu-latest
    needs: hadolint
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: meta
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ inputs.image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        if: ${{ inputs.push && inputs.sign }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: ${{ inputs.push && inputs.sign }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ inputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install syft
        if: ${{ inputs.push }}
        uses: anchore/sbom-action/download-syft@v0

      # BuildKit already attaches an SPDX SBOM to every platform image, but
      # unsigned and unreadable for CycloneDX-only consumers such as
      # Dependency-Track. syft generates both formats from the pushed
      # per-platform images; they are also published as release assets.
      - name: Generate SBOMs
        if: ${{ inputs.push }}
        env:
          # Packages only: without this, every file owned by an RPM becomes a CycloneDX component
          SYFT_FILE_METADATA_SELECTION: none
          IMAGE: ${{ inputs.image }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.tag }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          INDEX=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')

          mkdir -p sbom
          for PLATFORM in ${PLATFORMS//,/ }; do
            SUFFIX="${PLATFORM//\//-}"
            DIGEST=$(jq -r --arg os "${PLATFORM%%/*}" --arg arch "${PLATFORM#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<< "${INDEX}")
            if [[ -z "${DIGEST}" ]]; then
              echo "::error::no ${PLATFORM} image in ${IMAGE}:${VERSION}"
              exit 1
            fi
            BASE="sbom/${NAME}-${VERSION}-${SUFFIX}"
            syft scan "registry:${IMAGE}@${DIGEST}" \
              --source-name "${IMAGE}" --source-version "${VERSION}" \
              -o "cyclonedx-json=${BASE}.cdx.json" \
              -o "spdx-json=${BASE}.spdx.json"
            echo "${DIGEST}" > "${BASE}.digest"
          done

      # An SBOM describes one platform image, so it is attested against the
      # platform digest rather than the index. :latest points at the same
      # platform images, so these attestations cover it as well.
      - name: Attest CycloneDX SBOMs with cosign (keyless)
        if: ${{ inputs.push && inputs.sign }}
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          for CDX in sbom/*.cdx.json; do
            DIGEST=$(cat "${CDX%.cdx.json}.digest")
            cosign attest --yes --type cyclonedx --predicate "${CDX}" "${IMAGE}@${DIGEST}"
          done

      - name: Upload SBOMs
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.meta.outputs.name }}
          path: sbom/*.json
          retention-days: 7
